# oiiaw config — copy to config.yaml and adjust paths.
# leave icloud_vault blank to auto-discover on first run.

paths:
  local_vault: "C:\\Obsidian\\Vault"
  cloud_vault: ""
  sync_baseline: "C:\\Obsidian\\Baseline"
  logs_dir: "C:\\Obsidian\\Logs"
  conflict_recovery_dir: "C:\\Obsidian\\oiiaw-recovery"  # must be outside both watched vaults

sync:
  stability_window: 3
  stabilize_wait: 8
  cooldown_seconds: 3
  cloud_probe_timeout: 5
  cloud_hydrate_timeout: 30
  hydrate_retry_initial: 15
  hydrate_retry_max: 300
  error_retry_initial: 5
  error_retry_max: 300
  cloud_confirm_retry: 5
  delete_grace_seconds: 30
  delete_batch_limit: 20
  delete_batch_window: 60
  protect_nonempty_from_zero: true
  local_generation_ttl: 86400  # remember locally-originated versions for one day
  local_generation_limit: 16  # bounded history per path
  big_file_threshold: 102400
  big_file_cooldown: 30

logging:
  console_level: "normal" # quiet | normal | verbose
  log_retention: 10

updates:
  enabled: true
  check_interval: 86400  # seconds; once per day

ignore:
  dirs: [".trash", ".fseventsd", ".spotlight-v100", ".apdisk"]
  files: [".ds_store", "workspace.json", "workspace-mobile.json"]
  patterns: []  # glob patterns matched against the relative path, e.g. "*.canvas", ".obsidian/plugins/*"
