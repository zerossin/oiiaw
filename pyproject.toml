[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oiiaw"
version = "0.1.0"
description = "Obsidian <-> iCloud sync bridge for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
oiiaw = "oiiaw.__main__:main"

[project.gui-scripts]
oiiaw-tray = "oiiaw.__main__:main_tray"
oiiaw-setup = "oiiaw.setup_wizard:main"

[tool.setuptools.packages.find]
include = ["oiiaw*"]
