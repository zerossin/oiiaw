[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oiiaw"
version = "0.1.1"
description = "Obsidian <-> iCloud sync bridge for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zerossin" }]
keywords = ["obsidian", "icloud", "sync", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
oiiaw = "oiiaw.__main__:main"

[project.gui-scripts]
oiiaw-tray = "oiiaw.__main__:main_tray"
oiiaw-setup = "oiiaw.setup_wizard:main"

[project.urls]
Homepage = "https://github.com/zerossin/oiiaw"
Repository = "https://github.com/zerossin/oiiaw"
Issues = "https://github.com/zerossin/oiiaw/issues"

[tool.setuptools.packages.find]
include = ["oiiaw*"]

[tool.setuptools.package-data]
oiiaw = ["assets/*.png", "assets/*.ico"]
